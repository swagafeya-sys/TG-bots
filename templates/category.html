{% extends 'base.html' %}{% block content %}<div class="row"><div><h1>{{cat.name}}</h1><p>{{cat.description}}</p></div>{% if me %}<a class="btn" href="/new/{{cat.id}}">+ Новая тема</a>{% endif %}</div>{% for t in topics %}<div class="topic"><a href="/topic/{{t.id}}"><b>{{t.title}}</b></a><small>{{t.username}} · ответов: {{t.replies}} {% if t.locked %}· 🔒{% endif %}</small></div>{% else %}<div class="card">Тем пока нет.</div>{% endfor %}{% endblock %}
