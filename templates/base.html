<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title or 'Forum'}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="/">FORUM</a><span class="navspace"></span>{% if me %}<span>{{me}} · {{role}}</span>{% if role in ['moderator','admin'] %}<a href="/admin">Панель</a>{% endif %}<a href="/logout">Выйти</a>{% else %}<a href="/login">Войти</a><a href="/register">Регистрация</a>{% endif %}</nav><main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
